<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VES Exchange Admin</title><style>body{font-family:system-ui;max-width:1100px;margin:35px auto;padding:0 18px;background:#f6f7f9;color:#18202a}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}input,button{padding:10px;border-radius:8px;border:1px solid #bbb}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.pill{padding:4px 8px;border-radius:999px;background:#eee}</style></head><body><h1>VES Exchange Admin</h1><div class=card><b>Admin key</b> <input id=key type=password placeholder="ADMIN_KEY"> <button onclick=load()>Load orders</button></div><div class=card><h3>Rate settings</h3><input id=rate placeholder="Market rate VES/USD"><button onclick=saveRate()>Save market rate</button></div><div class=card><h3>Orders</h3><div id=orders>Enter the admin key.</div></div><script>async function load(){let k=document.getElementById('key').value;let r=await fetch('/api/orders?key='+encodeURIComponent(k));if(!r.ok){orders.textContent='Unauthorized';return}let d=await r.json();orders.innerHTML='<table><tr><th>ID</th><th>Phone</th><th>USD</th><th>Rate</th><th>VES</th><th>Status</th><th>Action</th></tr>'+d.map(o=>`<tr><td>#${o.id}</td><td>${o.phone}</td><td>$${Number(o.usd_amount||0).toFixed(2)}</td><td>${Number(o.customer_rate||0).toFixed(2)}</td><td>${Number(o.ves_amount||0).toLocaleString()}</td><td><span class=pill>${o.status}</span></td><td><button onclick="setStatus(${o.id},'ready_for_payout')">Approve</button> <button onclick="setStatus(${o.id},'hold')">Hold</button> <button onclick="setStatus(${o.id},'completed')">Complete</button></td></tr>`).join('')+'</table>'}async function setStatus(id,status){let k=key.value;await fetch('/api/orders/'+id+'/status?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function saveRate(){let k=key.value;await fetch('/api/settings?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market_rate:rate.value})});alert('Saved')}</script></body></html>
